<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Scanning Tool</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #eef1f0;
  }
  #phone {
    max-width: 420px;
    margin: 16px auto;
    background: #1AA260;
    border: 5px solid #111827;
    border-radius: 42px;
    padding: 20px 18px 28px;
    min-height: 90vh;
  }
  h1.title {
    text-align: center;
    font-size: 30px;
    color: #111827;
    margin: 4px 0 18px;
    font-weight: 600;
  }
  .block { margin-bottom: 16px; }
  .block-header {
    background: #E8262B;
    color: #111827;
    border: 3px solid #111827;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 6px 12px;
    font-size: 15px;
    font-weight: 600;
  }
  .block-body {
    background: white;
    border: 3px solid #111827;
    border-radius: 0 0 10px 10px;
    padding: 10px;
  }
  .block-body.no-header { border-radius: 10px; }

  /* Location row: yellow select + decorative arrow box */
  .loc-row { display: flex; align-items: stretch; }
  select#batchLocation {
    flex: 1;
    background: #FFEB3B;
    border: none;
    font-size: 16px;
    font-weight: 600;
    color: #111827;
    padding: 8px;
    appearance: none;
    -webkit-appearance: none;
  }
  .arrow-box {
    width: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-left: 3px solid #111827;
    background: white;
    font-size: 14px;
    color: #1e3a5f;
  }

  /* Camera */
  #reader { width: 100%; max-height: 260px; border-radius: 6px; overflow: hidden; background: #000; }
  #reader video { width: 100% !important; height: auto !important; object-fit: cover; }
  #scanControls { display: flex; gap: 8px; margin-top: 8px; }

  button {
    font-size: 15px; padding: 10px 14px; border-radius: 8px; border: none;
    cursor: pointer; font-weight: 600;
  }
  .btn-block { width: 100%; }
  .btn-primary { background: #111827; color: white; }
  .btn-gray { background: #808080; color: white; }
  .btn-accept { background: #16a34a; color: white; flex: 1; }
  .btn-decline { background: #dc2626; color: white; flex: 1; }

  /* Manual entry */
  .manual-row { display: flex; gap: 8px; }
  .manual-row input {
    flex: 1; padding: 9px 10px; font-size: 15px; border-radius: 8px; border: 2px solid #111827;
  }

  /* Scanned items list */
  #listBlock .block-body { min-height: 320px; }
  #placeholderText { text-align: center; font-weight: 700; color: #111827; margin-top: 130px; font-size: 16px; }
  #historyList { max-height: 55vh; overflow-y: auto; }
  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 13px;
  }
  .history-ok { background: #dcfce7; }
  .history-err { background: #fee2e2; }
  .history-item .hcode { font-weight: 700; }
  .history-item .htime { font-size: 11px; color: #555; }

  #status { font-size: 14px; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; display: none; text-align: center; font-weight: 600; }
  .status-ok { background: #dcfce7; color: #166534; display: block !important; }
  .status-err { background: #fee2e2; color: #991b1b; display: block !important; }

  #confirmBlock { display: none; }
  #confirmBlock .code { font-size: 20px; font-weight: 700; text-align: center; margin: 6px 0 12px; word-break: break-all; }
  .confirm-btns { display: flex; gap: 8px; }

  #footerLink { text-align: center; margin-top: 10px; }
  #footerLink a { color: #0b3d23; font-size: 13px; }

  /* Access code gate */
  #gate { max-width: 360px; margin: 60px auto; padding: 0 16px; }
  #gate .block-body { text-align: center; }
  #gate input[type="password"] {
    width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 2px solid #111827; margin-bottom: 10px;
  }
</style>
</head>
<body>

  <!-- ACCESS CODE GATE -->
  <div id="gate" style="display:none;">
    <h1 class="title">Scanning Tool</h1>
    <div class="block">
      <div class="block-header">Access Code</div>
      <div class="block-body">
        <p style="font-size:14px;color:#333;margin-top:0;">Enter the code your team shared with you.</p>
        <input type="password" id="codeInput" placeholder="Access code">
        <button class="btn-primary btn-block" onclick="saveCode()">Continue</button>
        <div id="gateStatus" style="margin-top:8px;"></div>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="phone" style="display:none;">
    <h1 class="title">Scanning Tool</h1>

    <div id="status"></div>

    <!-- Location -->
    <div class="block">
      <div class="block-header">Location:</div>
      <div class="block-body" style="padding:0;">
        <div class="loc-row">
          <select id="batchLocation"></select>
          <div class="arrow-box">▼</div>
        </div>
      </div>
    </div>

    <!-- Scan Bar Code -->
    <div class="block">
      <div class="block-header">SCAN Bar CODE</div>
      <div class="block-body">
        <div id="reader" style="display:none;"></div>
        <div id="scanControls">
          <button class="btn-primary btn-block" id="startScan">▶ Start Scanning</button>
          <button class="btn-gray btn-block" id="toggleScan" style="display:none;">Pause</button>
        </div>

        <div id="confirmBlock">
          <div style="font-size:12px;color:#666;text-align:center;margin-top:10px;">Scanned:</div>
          <div class="code" id="confirmCode"></div>
          <div class="confirm-btns">
            <button class="btn-accept" onclick="acceptScan()">✅ Accept</button>
            <button class="btn-decline" onclick="declineScan()">❌ Decline</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Manual Entry -->
    <div class="block">
      <div class="block-header" style="text-align:center;">Manual Entry</div>
      <div class="block-body">
        <div class="manual-row">
          <input type="text" id="manualBarcode" placeholder="">
          <button class="btn-gray" onclick="handleManualLookup()">Submit</button>
        </div>
      </div>
    </div>

    <!-- List of Scanned items -->
    <div class="block" id="listBlock">
      <div class="block-body no-header">
        <div id="placeholderText">List of Scanned items</div>
        <div id="historyList"></div>
      </div>
    </div>

    <div id="footerLink"><a href="#" onclick="signOut();return false;">Use a different code</a></div>
  </div>

<script>
  // ======= SET THIS to your deployed Apps Script Web App URL (ends in /exec) =======
  const API_URL = 'https://script.google.com/macros/s/AKfycbyW_bbl6oNEQhpTQrfP2mEWILCOwwcgEurxsf8uAu9zzX9wCBrU9iKT7hjfS4YMcwro/exec';
  // ===================================================================================

  let FIELDS = null;
  let LOCATION_FIELD = null;
  let pendingBarcode = null;
  let scanner = null;
  let scanningPaused = false;
  let historyCount = 0;

  function getCode() { return localStorage.getItem('scanner_code'); }

  function showStatus(msg, ok, elId) {
    const el = document.getElementById(elId || 'status');
    el.textContent = msg;
    el.className = ok ? 'status-ok' : 'status-err';
    setTimeout(() => { el.className = ''; el.style.display = 'none'; }, 3500);
  }

  // ---- JSONP helper: lets us call the Apps Script API from a different domain ----
  function callApi(action, params) {
    return new Promise((resolve, reject) => {
      const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      window[cbName] = (data) => {
        delete window[cbName];
        script.remove();
        resolve(data);
      };
      const query = new URLSearchParams({
        action, code: getCode() || '', callback: cbName, ...params
      }).toString();
      const script = document.createElement('script');
      script.src = API_URL + '?' + query;
      script.onerror = () => { delete window[cbName]; script.remove(); reject(new Error('Network error')); };
      document.body.appendChild(script);
    });
  }

  function saveCode() {
    const val = document.getElementById('codeInput').value.trim();
    if (!val) return;
    localStorage.setItem('scanner_code', val);
    verifyAndEnter();
  }

  function signOut() {
    localStorage.removeItem('scanner_code');
    document.getElementById('phone').style.display = 'none';
    document.getElementById('gate').style.display = 'block';
  }

  function verifyAndEnter() {
    callApi('config', {}).then(res => {
      if (!res.success) {
        showStatus(res.error || 'Invalid code', false, 'gateStatus');
        localStorage.removeItem('scanner_code');
        return;
      }
      FIELDS = res.fields;
      LOCATION_FIELD = FIELDS.find(f => f.name === 'Location') || FIELDS[0];
      populateLocationDropdown();
      document.getElementById('gate').style.display = 'none';
      document.getElementById('phone').style.display = 'block';
    }).catch(() => showStatus('Network error, try again', false, 'gateStatus'));
  }

  function populateLocationDropdown() {
    const sel = document.getElementById('batchLocation');
    sel.innerHTML = '';
    (LOCATION_FIELD.options || []).forEach(opt => {
      const o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      sel.appendChild(o);
    });
  }

  function startScanner() {
    document.getElementById('reader').style.display = 'block';
    document.getElementById('startScan').style.display = 'none';
    document.getElementById('toggleScan').style.display = 'block';

    scanner = new Html5Qrcode('reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 120 } },
      onScanSuccess,
      () => {}
    ).catch(err => {
      showStatus('Camera error: ' + err, false);
      document.getElementById('reader').style.display = 'none';
      document.getElementById('startScan').style.display = 'block';
      document.getElementById('toggleScan').style.display = 'none';
    });
  }
  document.getElementById('startScan').addEventListener('click', startScanner);

  function onScanSuccess(decodedText) {
    if (scanningPaused || pendingBarcode) return;
    pendingBarcode = decodedText;
    if (scanner) { try { scanner.pause(true); } catch (e) {} }
    document.getElementById('confirmCode').textContent = decodedText;
    document.getElementById('confirmBlock').style.display = 'block';
  }

  document.getElementById('toggleScan').addEventListener('click', () => {
    scanningPaused = !scanningPaused;
    document.getElementById('toggleScan').textContent = scanningPaused ? 'Resume' : 'Pause';
  });

  function acceptScan() {
    const code = pendingBarcode;
    hideConfirmBlock();
    handleBarcode(code);
  }

  function declineScan() {
    hideConfirmBlock();
  }

  function hideConfirmBlock() {
    pendingBarcode = null;
    document.getElementById('confirmBlock').style.display = 'none';
    if (scanner) { try { scanner.resume(); } catch (e) {} }
  }

  function handleManualLookup() {
    const val = document.getElementById('manualBarcode').value.trim();
    if (val) {
      document.getElementById('manualBarcode').value = '';
      pendingBarcode = val;
      document.getElementById('confirmCode').textContent = val;
      document.getElementById('confirmBlock').style.display = 'block';
    }
  }

  function handleBarcode(code) {
    const activeLocation = document.getElementById('batchLocation').value;
    callApi('update', { barcode: code, field: LOCATION_FIELD.name, value: activeLocation })
      .then(res => addHistoryItem(code, res.success, res.success ? activeLocation : res.error))
      .catch(err => addHistoryItem(code, false, err.message));
  }

  function addHistoryItem(code, ok, message) {
    historyCount++;
    document.getElementById('placeholderText').style.display = 'none';
    const list = document.getElementById('historyList');
    const item = document.createElement('div');
    item.className = 'history-item ' + (ok ? 'history-ok' : 'history-err');
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    item.innerHTML = '<span class="hcode">' + code + '</span>' +
      '<span>' + (ok ? '✅ ' + message : '❌ ' + message) + '</span>' +
      '<span class="htime">' + time + '</span>';
    list.insertBefore(item, list.firstChild);
    showStatus(ok ? 'Updated ' + code : 'Failed: ' + code, ok);
  }

  // ---- On load ----
  if (getCode()) {
    verifyAndEnter();
  } else {
    document.getElementById('gate').style.display = 'block';
  }
</script>
</body>
</html>
